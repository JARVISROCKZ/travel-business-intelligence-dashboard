<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS World Tourism — Business Intelligence Suite</title>
<style>
  :root{
    --ink:#0F2136;
    --ink-2:#16304C;
    --paper:#F7F4EC;
    --card:#FFFFFF;
    --line:#E4DFD0;
    --text:#1B2430;
    --text-soft:#5B6472;
    --amber:#E2A542;
    --amber-deep:#C6862A;
    --teal:#1C7C74;
    --teal-soft:#DCEEEC;
    --coral:#D9634B;
    --coral-soft:#FBE4DF;
    --sky:#4C7EA8;
    --sky-soft:#E2ECF3;
    --gold-soft:#FBF0D9;
    --radius:10px;
    --mono: 'Courier New', Courier, monospace;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--amber); color:var(--ink);}

  /* ---------- layout ---------- */
  #app{display:flex; min-height:100vh;}
  .sidebar{
    width:250px; flex:0 0 250px; background:var(--ink);
    background-image: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:#fff; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{padding:26px 22px 18px; border-bottom:1px dashed rgba(255,255,255,.18);}
  .brand .kicker{font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; color:var(--amber); text-transform:uppercase;}
  .brand h1{font-family:var(--serif); font-size:21px; margin:6px 0 2px; line-height:1.15; font-weight:700;}
  .brand .sub{font-size:11px; color:rgba(255,255,255,.55);}

  .flight-strip{padding:14px 22px; border-bottom:1px dashed rgba(255,255,255,.18); font-family:var(--mono); font-size:10px; color:rgba(255,255,255,.45); letter-spacing:.05em;}

  nav{padding:10px 12px 20px; flex:1;}
  .navitem{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:transparent; border:none; color:rgba(255,255,255,.72);
    padding:12px 10px; margin:3px 0; cursor:pointer; border-radius:8px;
    font-family:var(--sans); font-size:13.5px; position:relative;
    border-left:3px solid transparent;
  }
  .navitem .code{font-family:var(--mono); font-size:10.5px; color:rgba(255,255,255,.4); width:34px; flex-shrink:0; letter-spacing:.03em;}
  .navitem:hover{background:rgba(255,255,255,.06); color:#fff;}
  .navitem.active{background:rgba(226,165,66,.14); color:#fff; border-left:3px solid var(--amber);}
  .navitem.active .code{color:var(--amber);}

  .sidebar-foot{padding:16px 22px 22px; border-top:1px dashed rgba(255,255,255,.18); font-size:10.5px; color:rgba(255,255,255,.4); font-family:var(--mono);}

  main{flex:1; min-width:0; padding:34px 40px 60px;}
  .pagehead{margin-bottom:22px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px;}
  .pagehead .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--amber-deep); text-transform:uppercase; margin-bottom:4px;}
  .pagehead h2{font-family:var(--serif); font-size:28px; margin:0; color:var(--ink);}
  .pagehead p{margin:6px 0 0; color:var(--text-soft); font-size:13.5px; max-width:640px;}
  .stamp{font-family:var(--mono); font-size:10.5px; color:var(--text-soft); border:1px solid var(--line); padding:6px 10px; border-radius:20px; background:var(--card); white-space:nowrap;}

  /* ---------- kpi row ---------- */
  .kpirow{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px; margin-bottom:24px;}
  .kpi{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; position:relative; overflow:hidden;
  }
  .kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--amber);}
  .kpi.teal::before{background:var(--teal);}
  .kpi.coral::before{background:var(--coral);}
  .kpi.sky::before{background:var(--sky);}
  .kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-soft); margin-bottom:8px;}
  .kpi .value{font-family:var(--mono); font-size:24px; font-weight:700; color:var(--ink); line-height:1;}
  .kpi .delta{font-size:11px; margin-top:6px; color:var(--text-soft);}

  /* ---------- grid / cards ---------- */
  .grid{display:grid; gap:16px; margin-bottom:16px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:1000px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px;}
  .card h3{font-family:var(--serif); font-size:16px; margin:0 0 2px; color:var(--ink);}
  .card .cardsub{font-size:11.5px; color:var(--text-soft); margin-bottom:14px;}
  .card.span2{grid-column: span 2;}
  @media (max-width:1000px){.card.span2{grid-column:span 1;}}

  /* ---------- charts ---------- */
  .barrow{display:flex; align-items:center; gap:10px; margin:9px 0; font-size:12.5px;}
  .barrow .lbl{width:150px; flex-shrink:0; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .barrow .track{flex:1; background:#EFEAE0; border-radius:5px; height:16px; overflow:hidden; position:relative;}
  .barrow .fill{height:100%; border-radius:5px 0 0 5px; background:var(--amber);}
  .barrow .val{width:78px; text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--text-soft); flex-shrink:0;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-soft); border-bottom:1px solid var(--line); padding:7px 8px; font-weight:600;}
  table td{padding:8px 8px; border-bottom:1px solid #F0ECE0; color:var(--text);}
  table tr:last-child td{border-bottom:none;}
  table td.num, table th.num{text-align:right; font-family:var(--mono);}
  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-family:var(--mono);}
  .tag.green{background:var(--teal-soft); color:var(--teal);}
  .tag.red{background:var(--coral-soft); color:var(--coral);}
  .tag.gold{background:var(--gold-soft); color:var(--amber-deep);}
  .tag.blue{background:var(--sky-soft); color:var(--sky);}

  .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; font-size:11.5px; color:var(--text-soft);}
  .legend .dot{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:6px;}

  .page{display:none; animation: fade .35s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .footnote{font-size:11px; color:var(--text-soft); margin-top:2px;}
  .divider-dash{border:none; border-top:1px dashed var(--line); margin:24px 0;}

  svg text{font-family:var(--sans);}
  .axis-label{font-size:10px; fill:var(--text-soft);}

  @media print{ .sidebar{display:none;} main{padding:0;} }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="kicker">Boarding Pass · BI Suite</div>

    </div>

    <nav id="nav"></nav>
    <div class="sidebar-foot">Generated from<br>AS_WORLD_TOURISM_Dataset.xlsx<br>No internet required</div>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA = JSON.parse(document.getElementById('DATA_JSON').textContent);
const INR = n => '₹' + Math.round(n).toLocaleString('en-IN');
const INRc = n => {
  n = Math.round(n);
  if (Math.abs(n) >= 10000000) return '₹' + (n/10000000).toFixed(2) + ' Cr';
  if (Math.abs(n) >= 100000) return '₹' + (n/100000).toFixed(2) + ' L';
  return '₹' + n.toLocaleString('en-IN');
};
const pct = n => n.toFixed(1) + '%';
const PALETTE = ['#E2A542','#1C7C74','#D9634B','#4C7EA8','#8E6BAE','#5B6472','#C6862A','#2E9E93'];

/* ---------------- Chart engine (pure SVG, no deps) ---------------- */

function svgEl(w,h,extra){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet" ${extra||''}>`; }

// Horizontal bar list (HTML, not svg) — used for ranked lists
function hBarList(container, rows, opts){
  opts = opts||{};
  const max = Math.max(...rows.map(r=>r.value)) || 1;
  const color = opts.color || 'var(--amber)';
  let html = '';
  rows.forEach(r=>{
    const w = Math.max(2, (r.value/max*100));
    html += `<div class="barrow">
      <div class="lbl" title="${r.label}">${r.label}</div>
      <div class="track"><div class="fill" style="width:${w}%; background:${r.color||color}"></div></div>
      <div class="val">${r.display||r.value}</div>
    </div>`;
  });
  container.innerHTML = html;
}

// Vertical column chart (SVG)
function columnChart(container, rows, opts){
  opts = opts || {};
  const W = opts.width||520, H = opts.height||220;
  const padL=44, padB=34, padT=14, padR=14;
  const cw = W-padL-padR, ch = H-padT-padB;
  const max = Math.max(...rows.map(r=>r.value), 1) * 1.15;
  const bw = cw/rows.length;
  let bars='', labels='', grid='';
  for(let i=0;i<=4;i++){
    const y = padT + ch - (ch*i/4);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E9E4D6" stroke-width="1"/>`;
    grid += `<text class="axis-label" x="${padL-6}" y="${y+3}" text-anchor="end">${opts.fmtY ? opts.fmtY(max*i/4) : Math.round(max*i/4)}</text>`;
  }
  rows.forEach((r,i)=>{
    const bh = (r.value/max)*ch;
    const x = padL + i*bw + bw*0.18;
    const bwid = bw*0.64;
    const y = padT+ch-bh;
    bars += `<rect x="${x}" y="${y}" width="${bwid}" height="${bh}" rx="3" fill="${r.color||opts.color||'var(--amber)'}"><title>${r.label}: ${r.display||r.value}</title></rect>`;
    labels += `<text class="axis-label" x="${x+bwid/2}" y="${H-10}" text-anchor="middle">${r.label}</text>`;
  });
  container.innerHTML = svgEl(W,H) + grid + bars + labels + '</svg>';
}

// Line/area chart for trend, supports multiple series sharing one x
function lineChart(container, xs, series, opts){
  opts = opts||{};
  const W = opts.width||760, H = opts.height||220;
  const padL=54, padB=30, padT=16, padR=20;
  const cw=W-padL-padR, ch=H-padT-padB;
  const allVals = series.flatMap(s=>s.values);
  const maxV = Math.max(...allVals)*1.15;
  const minV = 0;
  const stepX = cw/(xs.length-1||1);
  let grid='', axisX='';
  for(let i=0;i<=4;i++){
    const y = padT + ch - (ch*i/4);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E9E4D6" stroke-width="1"/>`;
    grid += `<text class="axis-label" x="${padL-8}" y="${y+3}" text-anchor="end">${opts.fmtY ? opts.fmtY(maxV*i/4) : Math.round(maxV*i/4)}</text>`;
  }
  xs.forEach((x,i)=>{
    if(i % (opts.xEvery||1) === 0){
      axisX += `<text class="axis-label" x="${padL+i*stepX}" y="${H-8}" text-anchor="middle">${x}</text>`;
    }
  });
  let paths='';
  series.forEach(s=>{
    let d='', area='';
    s.values.forEach((v,i)=>{
      const px = padL+i*stepX;
      const py = padT + ch - ((v-minV)/(maxV-minV||1))*ch;
      d += (i===0?'M':'L')+px+','+py+' ';
    });
    area = d + `L${padL+cw},${padT+ch} L${padL},${padT+ch} Z`;
    if(s.area) paths += `<path d="${area}" fill="${s.color}" opacity="0.12"/>`;
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4"/>`;
    s.values.forEach((v,i)=>{
      const px = padL+i*stepX;
      const py = padT + ch - ((v-minV)/(maxV-minV||1))*ch;
      paths += `<circle cx="${px}" cy="${py}" r="3" fill="${s.color}"><title>${xs[i]}: ${s.fmt?s.fmt(v):v}</title></circle>`;
    });
  });
  container.innerHTML = svgEl(W,H) + grid + paths + axisX + '</svg>';
}

// Donut chart
function donutChart(container, rows, opts){
  opts = opts||{};
  const size = opts.size||180, r=size*0.38, cx=size/2, cy=size/2, rw=opts.thickness||22;
  const total = rows.reduce((a,b)=>a+b.value,0)||1;
  let angle=-90, paths='';
  rows.forEach((row,i)=>{
    const frac = row.value/total;
    const start = angle;
    const end = angle + frac*360;
    angle = end;
    const large = (end-start)>180?1:0;
    const toXY = (a,rad)=>{
      const rad2 = (a*Math.PI/180);
      return [cx+rad*Math.cos(rad2), cy+rad*Math.sin(rad2)];
    };
    const [x1,y1] = toXY(start, r);
    const [x2,y2] = toXY(end, r);
    const col = row.color || PALETTE[i%PALETTE.length];
    paths += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${rw}"><title>${row.label}: ${row.value} (${(frac*100).toFixed(1)}%)</title></path>`;
  });
  let center = opts.center ? `<text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="var(--mono)" font-size="18" font-weight="700" fill="var(--ink)">${opts.center}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9.5" fill="var(--text-soft)">${opts.centerSub||''}</text>` : '';
  container.innerHTML = `<div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
    ${svgEl(size,size)}${paths}${center}</svg>
    <div class="legend" style="flex-direction:column; gap:7px; margin-top:0;">
      ${rows.map((row,i)=>`<div><span class="dot" style="background:${row.color||PALETTE[i%PALETTE.length]}"></span>${row.label} — <strong>${row.display||row.value}</strong></div>`).join('')}
    </div>
  </div>`;
}

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = PAGES.map(p=>`<button class="navitem" data-id="${p.id}"><span class="code">${p.code}</span><span>${p.title}</span></button>`).join('');
  nav.querySelectorAll('.navitem').forEach(btn=>{
    btn.addEventListener('click', ()=> showPage(btn.dataset.id));
  });
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelector(`.navitem[data-id="${id}"]`).classList.add('active');
  window.scrollTo(0,0);
}

      <h2>${title}</h2>
      <p>${sub}</p>
    </div>
    <div class="stamp">${stamp}</div>
  </div>`;
}

  const main = document.getElementById('main');
